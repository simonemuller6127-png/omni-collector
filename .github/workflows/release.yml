name: Build and Release Obsidian Plugin

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use preinstalled Node + install pnpm
        run: |
          node --version
          npm --version
          npm install -g pnpm@9

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          set +e
          pnpm build > /tmp/build.log 2>&1
          code=$?
          cat /tmp/build.log
          exit $code

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Assemble release artifacts
        run: |
          mkdir -p release
          cp apps/obsidian-plugin/dist/main.js release/main.js
          cp apps/obsidian-plugin/manifest.json release/manifest.json
          cp apps/obsidian-plugin/styles.css release/styles.css

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
          generate_release_notes: true
