name: Build and Release Obsidian Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use preinstalled Node + install pnpm
        run: |
          node --version
          npm --version
          npm install -g pnpm@9

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Assemble release artifacts
        run: |
          mkdir -p release
          cp apps/obsidian-plugin/dist/main.js release/main.js
          cp apps/obsidian-plugin/manifest.json release/manifest.json
          cp apps/obsidian-plugin/styles.css release/styles.css
          cd release
          zip -r ../omni-collector.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
            omni-collector.zip
          generate_release_notes: true
